name: 出典URLの死活（週1・手動）

# ★通常のCI(ci.yml)には入れない。理由:
#   ・外部の官公庁サイトに毎回13本叩くと、向こうの都合(メンテ・混雑・レート制限)でCIが赤くなる。
#     それは「うちのコードが壊れた」ではないのに push が止まり、業務が止まる。
#   ・自分のせいでない理由で赤が出ると、人は赤を無視するようになる。それが一番まずい
#     （本物の赤も見なくなる）。
#   だから【別ワークフロー】で週1＋手動。落ちても push は止まらない。
#   見つかった404は実行ログに一覧で出る＝指示役が見て中央 statutory を直す。
#   ★この道具は読むだけ（anon GET）。中央へ書く経路は無い。
#
# ★誰が見るか（docs/SPEC_engine_grid_contract_v0.md §12.2）
#   落ちたらその週のうちに実装セッションが気づき、★次の報告に必ず
#   「出典URL 生きているN／死んでいるM」の1行を載せる★。
#   誰も見ない週1は、無いのと同じ。落ちていない週も数字を出すのは、
#   ワークフロー自体が止まっていることに気づくため。

# ★★PRでは 鳴かない事を 承知の上で 週1のまま にしている（2026-09-04 指示役の裁定）★★
#   ★出典URL の 死活★と ★88,000円の 撤廃★は ★外の 本文が 無いと 判らない★
#     ＝法定を 直す PR を 出しても ★その PR では 1回も 鳴かない★。★承知の上★。
#   ★では PR で 何を 見ているか★
#     ★台帳（statutory-central.generated）と lib の ズレ（年度・値）★は
#     ★kyuyo/tests/statutory-freshness.test.mjs★ が ★ci.yml で 毎回★ 見ている（★外に 出ない★）。
#     ⇒★同じ物を 見る 見張りを 2本 作らない★（2026-09-04＝丙として 作りかけたが 捨てた）。
#   ★2026-09-04 実測で 1つ 穴を 塞いだ★
#     ＝lib の NENDO_YEAR だけ 年度を 進めても 緑のままだった（行の年が 打ち込みだった）。
#       statutory-rows.js の 最賃の行を lib から 取るように 直し、偽の lib を 通す 試験を 足した。
#
# ★★試験を 登録する 先の 使い分け（2026-09-04 指示役の問い）★★
#   ・★kyuyo/tests/run.js★ … `.test.js` を ★束ねて★ 走らせる（中で T() を 使う物）
#   ・★ci.yml に 1行★ … `.test.mjs` の ように ★自分で 走る★ 物（run.js は 拾わない）
#   ⇒★.mjs を 作ったら ci.yml に 書かないと ★1本も 走らない★（緑に 見えるだけ）★

on:
  schedule:
    - cron: '0 0 * * 1'      # 毎週月曜 00:00 UTC = 日本時間 月曜9時
  workflow_dispatch:          # 手動でも回せる

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ★中央statutoryの出典URLが全部生きているか（404なら赤・ただしCIは止めない）
        run: node kyuyo/scripts/check-source-urls.mjs

      # ★社保 適用拡大の賃金要件(月88,000円)が法令から消えたか＝e-Gov法令データを実際に叩いて数える。
      #   撤廃は「令和8年10月」予定だが施行日は政令事項＝まだ動く。人が読むページは「予定」としか書かない。
      #   ここが赤(exit 3)＝★切替が要る合図★。★期限 2026-09-15★ までに人が見て判断する。
      #   出典URLと同じ理由で通常CIには入れない（外のサイトの都合で push を止めない）。
      - name: ★賃金要件(88,000円)の撤廃が法令に入ったか（入っていたら赤＝切替の合図）
        run: node kyuyo/scripts/check-wage88k-removal.mjs

      # ★最低賃金の「次の年度」が公式に出たか＝厚労省「地域別最低賃金の全国一覧」を実際に叩いて年度を読む。
      #   最賃は毎年10月に入れ替わる。libは令和7年度(2025-10〜)。★2026-10分の給与から令和8年度が要る★。
      #   ここが赤(exit 3)＝★入れ替えの合図★。額の抜き出しは人が pdftotext -layout でやる
      #   （機械にPDFを読ませて黙って数字を書き換えさせない。前科: 2026-07-10 に47県中38県が誤値だった）。
      #   取れなかった回は 🟡未測定 と出す＝「今のままでよい」と混ぜない。
      - name: ★最低賃金の年度が進んだか（進んでいたら赤＝入れ替えの合図）
        run: node kyuyo/scripts/check-saitei-nendo.mjs
