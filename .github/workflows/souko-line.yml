name: 倉庫線しらべ（棚③・手で起こす・使い捨て）

# ★なぜ 別の・手で起こすだけの ワークフローか★（指示役と 2026-10-03 に 決めた）
#   棚③＝客の ログイン→倉庫 の 線が ときどき 詰まる（ログインの 再試し／約19秒の 線落ち）のは
#   ★この PC の 網★か ★倉庫が その時だけ 遅い★かを 割る。手元 N回と GitHub N回を
#   ★同じ 時間帯★に 回して 並べる。
#
# ★定時（schedule）は 付けない★（材料無しで 定時に 走り 緑を 返す 物は 止める＝
#   memory: feedback_teiji_de_karamawari_midori_wa_ryouhou_no_repo_de_tomeru）。
# ★push/pull_request も 付けない★＝人が 手で 起こす 時だけ 走る。
# ★本番 repo には 置かない★（テスト線だけ）。★測り終えたら 止めた印を 付けるか 消す★。
#   止める条件＝tests-no-ci.json の tests/souko-line-10kai.mjs の "back" の日。
#
# ★外（本物の 倉庫）を 叩く★＝GitHub の 網から 試験の 倉庫へ 実ログイン（test@test.com）で つなぐ。
#   ★書きは 起こさない★（harness が 網で pay_ の 書きを 偽の 200 で 止める）＝倉庫は 1行も 動かない。

on:
  workflow_dispatch:
    inputs:
      n:
        description: '1ブラウザあたりの回数（既定10）'
        required: false
        default: '10'
      kind:
        description: 'ブラウザ（webkit,chromium）'
        required: false
        default: 'webkit,chromium'

jobs:
  souko-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps webkit chromium
      - name: ★客の ログイン→倉庫 の 線を 数える（手元の 同時間帯と 並べる）
        run: node tests/souko-line-10kai.mjs --n='${{ github.event.inputs.n }}' --kind='${{ github.event.inputs.kind }}'
