name: WebKit（iOSと同じエンジンで測る）

# ★なぜ 別のワークフローか★（指示役 2026-08-28 の裁定＝案A）
#   ・Chromium だけでは iOS は分からない（scripts/input-size.mjs は Chrome で毎回 測っている）
#   ・でも ★毎回 WebKit を入れるのは 重い★（ブラウザのダウンロードが要る）
#   ・かといって ★「毎回 未測定」は 見張りではない★＝★在るのに0回★（今週 ダイコメで3回 踏んだ型）
#   ⇒ ★週1（月曜 朝）★ と ★見た目に関わる所を触った時★ の2つだけ ★本当に測る★。
#
# ★測る物★ … 16px未満の打つ欄／20×20未満の押す的／横はみ出し（幅 375・390・430）
# ★測れない時は 赤にせず「未測定」と はっきり言う★（0件と 未測定を 混ぜない）＝scripts/webkit-size.mjs

on:
  schedule:
    # ★週1（日曜 22:00 UTC＝月曜 07:00 JST）★ … 誰も押さなくても 週に1回は 必ず測る
    - cron: '0 22 * * 0'
  push:
    branches: [main]
    paths:
      # ★見た目に関わる所を触った時★＝直した日に その場で分かる
      - 'seikyu/**'
      - 'kyuyo/css/**'
      # ★★2026-09-14 足した＝★足した 見張りが 引き金に 入っていなかった★★★
      #   この 仕事に ★客の 画面を 押す 見張り★を 2本 載せた（fuyo-ui / seirino-ui）のに、
      #   ★その 画面を 作る kyuyo/js/** も 見張り本体の kyuyo/tests/** も 引き金に 無かった★。
      #   ＝js を 直しても ★刻印が kyuyo/index.html を 書き換えた ついで★でしか 走らず、
      #     ★試験だけ 直した 回は 押した その場では 走らない★（週1の cron まで 遅れる）。
      #   ＝★門としては 死んでいる★（押した回に 止められない）ので 引き金に 自分を 入れる。
      - 'kyuyo/js/**'
      - 'kyuyo/tests/**'
      - 'kyuyo/index.html'
      - 'kyuyo/admin.html'
      - 'kyuyo/meisai.html'
      - 'css/**'
      - 'index.html'
      - 'scripts/webkit-size.mjs'
      - 'seikyu/lib/seikyu-pdf.js'
      - 'seikyu/lib/seikyu-paper.js'
      - '.github/workflows/webkit.yml'
  # ★PR でも 走らせる★（2026-09-04 指示役／Exally 実測）
  #   ★schedule と push(main) だけだと ★入れた後で 初めて 赤に なる★★
  #   ＝直すのが「本番／テスト線に 入れた 後」に なる。PR の 中で 転べば ★本番の 外★で 直せる。
  #   ★paths は push 側と ★同じ★★（増やさない・減らさない）
  #     ＝関係ない PR では 走らない＝★ブラウザを 落とす 重さを 増やさない★。
  #   ★この見張りは repo の 中を 測るだけ★（外のサイトを 叩かない）＝毎PRでも 迷惑を かけない。
  pull_request:
    paths:
      - 'seikyu/**'
      - 'kyuyo/css/**'
      # ★★2026-09-14 足した＝★足した 見張りが 引き金に 入っていなかった★★★
      #   この 仕事に ★客の 画面を 押す 見張り★を 2本 載せた（fuyo-ui / seirino-ui）のに、
      #   ★その 画面を 作る kyuyo/js/** も 見張り本体の kyuyo/tests/** も 引き金に 無かった★。
      #   ＝js を 直しても ★刻印が kyuyo/index.html を 書き換えた ついで★でしか 走らず、
      #     ★試験だけ 直した 回は 押した その場では 走らない★（週1の cron まで 遅れる）。
      #   ＝★門としては 死んでいる★（押した回に 止められない）ので 引き金に 自分を 入れる。
      - 'kyuyo/js/**'
      - 'kyuyo/tests/**'
      - 'kyuyo/index.html'
      - 'kyuyo/admin.html'
      - 'kyuyo/meisai.html'
      - 'css/**'
      - 'index.html'
      - 'scripts/webkit-size.mjs'
      - 'seikyu/lib/seikyu-pdf.js'
      - 'seikyu/lib/seikyu-paper.js'
      - '.github/workflows/webkit.yml'
  workflow_dispatch:

jobs:
  webkit:
    runs-on: ubuntu-latest
    # ★ここは「測る為に 用意した場所」＝道具が 無いのは 用意の失敗＝赤★（指示役の裁定 2026-09-02）
    #   手元・毎回のCI では 同じ試験が ★未測定・緑（声は 出す）★ になる。
    #   判定は scripts/_borrow-playwright.mjs が 1か所で 持つ（★yml に 書き足さない★）。
    env:
      MEASURE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test deps
        run: npm install --no-audit --no-fund
      # ★webkit だけ★ 入れる（chromium/firefox は要らない＝そのぶん速い）
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: ★WebKitで 375/390/430 を実測 (16px未満0本／押す的20×20未満0個／横はみ出し0px)
        run: node scripts/webkit-size.mjs
      # ★見た目の統一★（司さん 2026-08-29「統一感は？」）＝本物のブラウザで 色の値を読む物。
      #   ★毎回のCIには置かない★（ブラウザが無いので 毎回「未測定」になる＝在るのに0回）。
      - name: ★押す物の見た目が全画面で揃っているか (台帳9通り・緑1種類・角丸12/999/0)
        run: node tests/button-uniform.test.mjs
      - name: ★同 わざと崩して赤になるか（緑を混ぜる／字を灰色に戻す）
        run: node tests/button-uniform.test.mjs --self-test
      - name: ★請求書 聞く形のボタンの色 (画面の本命/ほかと同じ・緑は1種類・押す的20×20)
        run: node seikyu/tests/pask-color.test.mjs
      - name: ★同 わざと色を戻して赤になるか
        run: node seikyu/tests/pask-color.test.mjs --self-test
      # ★自作PDF★（司さん 2026-08-30「自作PDFのやり方しか指示してないわ」）
      #   ★本物のブラウザで 本物の紙から PDFを作って 数で見る★（chromium が要る）。
      #   司さんの指摘「なんでここが揃ってないんど／右揃えか左揃えかやろが」を 数で 押さえた物。
      - name: Install Chromium (自作PDFを 本物のブラウザで 作る為)
        run: npx playwright install --with-deps chromium
      - name: ★自作PDF 紙の揃え方を そのまま写しているか (右端/左端が紙と同じ・自社4行の右端が揃う・化け0)
        run: node seikyu/tests/pdf-align.mjs
      # ★お客はiPhone＝中身はWebKit★（司さん 2026-08-30「知り合いに使ってもらう」）
      #   ★測っていない engine で「出る」と言わない★＝chromiumで出た だけでは 足りない。
      #   ここは「出る・本当にPDF・字が入る・化け0・待たされない」だけを見る
      #   （紙の中の位置は 上の pdf-align.mjs が chromium で 測っている）。
      - name: ★自作PDFが iPhoneの中身(WebKit)でも 出るか (請求書/領収書・先頭%PDF-・化け0・20秒以内)
        run: node seikyu/tests/pdf-webkit.mjs
      # ★判子の大きさを 形で選り分ける★（司さん 2026-08-30
      #   「個人の苗字の判子の大きさと 角印の判子の大きさも 自動で選別してるか？」）
      #   ★印影を その場で描いて 測る★（絵は repo に置かない＝形が命なので 形を作って試す）
      - name: ★判子が 角印か 個人の丸い印かを 見分ける (四隅の墨で判定・白抜き・実UIのmm欄まで)
        run: node seikyu/tests/seal-shape.mjs
      # ★判子の場所★（司さん 2026-08-31「場所は自由に変えれんのか？」）
      #   決まった置き方を選ばせる形は 2度 差し戻された。今は 紙の上の mm で 自由に置く。
      - name: ★判子を 紙のどこにでも置けるか (指した所へ・紙から出ない・2枚とも同じ所・実UIで押す)
        run: node seikyu/tests/seal-pos.mjs
      - name: ★同 紙から出さない蓋が効いているか
        run: node seikyu/tests/seal-pos.mjs --self-test
      # ★紙は 本物のブラウザで 測る★（2026-09-02・口座1〜6 × 明細1/10/20行 × 控除なし/あり＝36通り）
      #   直す前は ★6口座で 口座番号が 丸ごと 消えていた★（.sheet は overflow:hidden＝黙って 切れる）
      # ★備考の枠★（司さん 2026-09-05「他2つは おれの様式のように デフォで 備考欄つけとけよ」）
      #   足元が 23px 高くなる＝明細の枠を 1行 減らさないと A4 を はみ出して ★黙って 切れる★
      # ★判子の 白抜き★（司さん 2026-09-09「判子が 自動で 透過されないから 背景が 邪魔になる」）
      #   ★画素を 数える★ので 実ブラウザが 要る＝ここ（webkit.yml）に 置く。
      - name: ★判子 (倉庫に残った白い地を自動で透かす/透けている物は触らない)
        run: node seikyu/tests/hanko-touka.mjs
      # ★列の 幅の 振り分け★（司さん 2026-09-10
      #   「消費税と備考欄の間が少な過ぎる／これを1塊として近づけて 項目と備考は多めに」）
      #   ★字の はみ出しは 画素でしか 分からない★ので 実ブラウザ＝ここ（webkit.yml）。
      - name: ★列の幅 (消費税の右にすきま/真ん中4列は1塊/字がはみ出さない/A4に収まる)
        run: node seikyu/tests/retsu-haba.mjs
      - name: 画面にブラウザ任せの英語を出さない（Choose File が出ていない）
        run: node seikyu/tests/eigo-dasanai.mjs
      - name: 同 わざと壊して赤になるか
        run: node seikyu/tests/eigo-dasanai.mjs --self-test
      - name: 2枚目・3枚目に入った紙（1枚目がスカスカにならない・A4に収まる）
        run: node seikyu/tests/maisuu.mjs
      - name: 同 わざと壊して赤になるか
        run: node seikyu/tests/maisuu.mjs --self-test
      - name: ★備考の枠を出しても 紙から はみ出さない（18通り 実測・A4 1122.5px）
        run: node seikyu/tests/memo-waku.mjs
      - name: ★同 足元を高くすると 赤になるか（自己確認・壊した数と赤の数を並べる）
        run: node seikyu/tests/memo-waku.mjs --self-test
      - name: ★口座を何個出しても 紙から 字が消えない（36通り 実測）
        run: node seikyu/tests/bank-paper.mjs
      - name: ★同 わざと直す前の形にすると はみ出すか（自己確認）
        run: node seikyu/tests/bank-paper.mjs --self-test
      # ★聞く形の札が 読めるか★（指示役の判定 2026-09-02＝口座の札が「1つの塊」に見えて 差し戻し）
      #   ★これは 数字には 1つも 出ない★ので 描いた物を 375/390/430 で 測る。
      # ★この1本だけ 記録係ごしに 走らせる★（2026-09-03＝1回だけ 赤／単発は緑／2回 回して 再現せず）
      #   ★「たまに赤」は まず 記録係★（赤の中身は 次の回で 上書きされる）＝tools/aka-kiroku.mjs
      #   ★止め方は 変えていない★＝赤は そのまま 赤で 止まる（握りつぶさない）
      - name: ★口座は1つずつ別の箱・選んだ札だけが光る（375/390/430で実測／赤は中身を残す）
        run: node tools/aka-kiroku.mjs -- node seikyu/tests/ask-look-webkit.mjs
      # ★倉庫の 答えが 遅れても 画面が 動かない／押させない／黙らない★（2026-09-05 指示役の裁定・案D）
      #   ★犯人は 1つずつ 遅らせて 測って 突き止めた★＝倉庫の状態(cloudLoadState) だけが 3737px 動かした。
      #   ★人の一覧は 答えが来るまで描かない／その間は確定を押させない／失敗は失敗と言う★
      - name: ★倉庫の答えが遅れても 動かない/押させない/黙らない（375・390・412／わざと落として失敗も見る）
        run: node kyuyo/tests/souko-machi.mjs --self-test && node kyuyo/tests/souko-machi.mjs
      # ★被扶養者(異動)届を お客さんの道どおり 押して 本当に ファイルを 落とす（2026-09-14）
      #   ★増えた／減った／変わった の 3通りとも★ 押して SHFD0006.CSV を 落とし、
      #   139列・項番21（異動の別）を ★1つずつ 読み合わせる★。
      #   ★自己確認つき★＝物差し自身を わざと 壊して 赤が 出る事を 先に 見る。
      #   ★足した人は 必ず 消す★（前後の 人数を 数えて 合わない時は 赤）。
      - name: ★被扶養者(異動)届が 3通りとも 本当に 落ちる（実ブラウザ・139列／★CIでは 倉庫を 数えていない★）
        run: node kyuyo/tests/fuyo-ui.mjs --self-test && node kyuyo/tests/fuyo-ui.mjs
      # ★被保険者整理番号が 画面から 入り 紙まで 届くか（2026-09-14）
      #   ★入れる欄が 1つも 無いのに 6本の CSV が e.hokenshaNo を 読んでいた★所の 見張り。
      - name: ★被保険者整理番号が 表と Excel まで 届く（実ブラウザ・出た字で 見る）
        run: node kyuyo/tests/seirino-ui.mjs
      # ★会社の 住所が ログインの 後に 画面まで 届くか（2026-09-14）
      #   ★倉庫の 読み直しと 同時に 走らせていて、後から 着いた 読み直しが 住所を 消していた★。
      #   住所が 空だと ★電子申請の 届出が 1枚も 出せない★（事業所所在地は 必須）。
      #   ★手で 呼べば 出る は 緑に しない★＝客は 手で 呼べない。
      - name: ★会社の 住所が ログインの後に 画面まで 届く（実ブラウザ・持ち主と1文字ずつ）
        run: node kyuyo/tests/kaisha-jusho-todoku.mjs
      # ★CI から 外していた 2本を 戻す（2026-09-14）
      #   外していた 訳＝「★CIでは 打った 値が 次の 描き直しに 間に合わず 落ちる★（私の 待ち方）」。
      #   ★今日 その 直しを 入れた★＝fill() で 入れ、★読み返して 見比べ、違えば もう一度★。
      #   手元で 2回ずつ 走らせて ★10本とも 緑／倉庫の 行数 3604 で 不動★を 見た。
      - name: ★資格取得届が 本当に 落ちる（実ブラウザ・34列／★CIでは 倉庫を 数えていない★）
        run: node kyuyo/tests/shutoku-ui.mjs
      - name: ★資格喪失届が 本当に 落ちる（実ブラウザ・27列／★CIでは 倉庫を 数えていない★）
        run: node kyuyo/tests/soshitsu-ui.mjs
      # ★後始末の 物差し そのもの★＝倉庫を 読むだけ・★赤が 出る事★を 自分で 見る
      - name: ★置き土産の 物差しの 自己確認（わざと ずらして 赤が 出るか）
        run: node kyuyo/tests/_souko-kazoeru.mjs
      # ★算定基礎届（2225700・53項目）を 実ブラウザで 押す（2026-09-14）
      #   ★4〜6月を 画面から 入れて 確定★してから 押す＝★確定した 明細が 要る 届出★。
      #   月額変更届は ★随時改定の 材料を 画面から 入れられていない＝はかれない★（緑に しない）。
      - name: ★算定基礎届が 本当に 落ちる（実ブラウザ・53列・整理番号の 字まで）
        run: node kyuyo/tests/santei-gekkaku-ui.mjs --self-test && node kyuyo/tests/santei-gekkaku-ui.mjs
