      #   ★毎回は要らない／でも「毎回 未測定」は 見張りではない★ ⇒
      #   ★.github/workflows/webkit.yml（週1＋seikyu/ を触った時）で ★本当に測る★★。
      #   ここに残すと ★毎回 未測定★＝★在るのに0回★になるので 置かない。
      - name: ★打つ欄が16px以上か (本物のChromeで実測・隠れている物も数える)
        run: node scripts/input-size.mjs
      - name: ★打つ欄16px (わざと小さくして 捕まえられるかの自己確認)
        run: node scripts/input-size.mjs --self-test
      - name: ★描かれた字の色を数える (13画面を本物のChromeで描かせて 控えと突き合わせる)
        run: node scripts/text-colors.mjs
      - name: ★描かれた字の色 (1か所ずつ色を変えて 捕まえられるかの自己確認・13通り)
        run: node scripts/text-colors.mjs --self-test
      - name: ★取引先7問 実UI (本物の画面を動かして 押す物の一覧を出してから全部 押す)
        run: node seikyu/tests/partner-ask-ui.mjs
      # ★1つのステップで 給与と請求書を混ぜない★（指示役 2026-08-26 の運びで実際に詰まった）
      #   混ざっていると ★本番へ運ぶ時に「在る物と無い物が混ざったステップ」になって止まる★。
      #   ship-seikyu.mjs は ★勝手に直さず 赤にする★ 作りなので、元の側で分けておく。
      - name: ★人が埋める欄を数える (給与の会社情報)
        run: node scripts/count-fields.mjs kyuyo/index.html --sel "#set-company"
      - name: ★人が埋める欄を数える (請求書の入力・畳んだ中も)
        run: node scripts/count-fields.mjs seikyu/index.html && node scripts/count-fields.mjs seikyu/index.html --closed
      # ★会社マスタ7問（聞いてあげる。埋めさせない。）★ 司さん 2026-08-16／指示役 2026-08-18
      #   ★同じ値を2か所が持たない★（7問へ上げた物はチップから消す）を機械で見張る。
      - name: ★会社マスタ7問 (7つ在る/県→最賃と業種→率が libの実数と一致/チップに残っていない/県が実際に効く)
        run: node kyuyo/tests/company-ask.test.mjs
      - name: ★会社マスタ7問 (わざと戻して赤になるかの自己確認・4通り)
        run: node kyuyo/tests/company-ask.test.mjs --self-test
      # ★従業員マスタ7問（1人ずつ聞く）★ 甲乙と扶養は別々の2問（指示役 2026-08-18 の訂正）
      - name: ★従業員マスタ7問 (7つ在る/年齢で決まる物/給料は押すまで入れない/マイカーの非課税はlib/県は会社から継ぐ)
        run: node kyuyo/tests/emp-ask.test.mjs
      - name: ★従業員マスタ7問 (わざと戻して赤になるかの自己確認・4通り)
        run: node kyuyo/tests/emp-ask.test.mjs --self-test
      - name: Payroll integration (jsdomで本物のapp.jsを読み配線/UI/状態/描画)
        run: node kyuyo/tests/integration.mjs
      - name: Payroll full-feature real-data (給与全パターン)
        run: node kyuyo/tests/payroll-patterns.mjs
      - name: Payroll UI smoke (全ボタンをクリックしてJS例外0)
        run: node kyuyo/tests/ui-smoke.mjs
      - name: Payroll cloud sync (保存層・Supabaseモック)
        run: node kyuyo/tests/cloud-sync.mjs
      - name: Payroll pagination (1000件超が黙って欠落しない)
        run: node kyuyo/tests/pagination.test.mjs
      - name: Payroll meisai store (Web明細 公開一覧/削除時リンク失効)
        run: node kyuyo/tests/meisai-store.mjs
      - name: Payroll QR (復号)
        run: node kyuyo/tests/qr.test.mjs
      - name: Payroll 年末調整 (Web申告/計算)
        run: node kyuyo/tests/nencho-web-declaration.test.js && node kyuyo/tests/nencho-compute.test.mjs
      - name: Golden freeze guard (移設前の真値と入力fixtureが作り直されていないか)
        run: node kyuyo/tests/golden-immutable.test.mjs
      - name: Headless guard (lib/ がDOM・通信・非決定性に依存しない)
        run: node kyuyo/scripts/verify-headless.mjs
      - name: ★源泉区分(204条) 選べるのに算式が無い区分を残さない＋実数1円一致
        run: node kyuyo/tests/gensen-kubun.test.mjs && node kyuyo/tests/gensen-kubun.test.mjs --self-test
      - name: ★契約が実データの書き方を受け取れるか (画面の選択肢を機械で突き合わせ)
        run: node kyuyo/tests/ops-real-values.test.mjs
      - name: Ops golden parity (★1円一致★ 移設前ゴールデン vs ops/payroll.monthly)
        run: node kyuyo/tests/ops-golden-parity.test.mjs
      - name: Ops statutory (官公値の実数リテラル・Excel同一ソース・テストAPI非露出)
        run: node kyuyo/tests/ops-payroll-monthly.test.mjs
      - name: Law switchpoints (健保R7→R8/支援金2026-04/雇用保険年度/最賃年度の境界前後)
        run: node kyuyo/tests/law-switchpoints.test.mjs
      # ★賃金要件(88,000円)撤廃の見張り。実際にe-Govを叩くのは週1(source-urls.yml)。
      #   ここでは【判定そのもの】が正しいかだけ見る(ネットに触らない=CIを外の都合で赤くしない)。
      - name: ★賃金要件撤廃の見張りの判定 (--self-test・ネットに触らない)
        run: node kyuyo/scripts/check-wage88k-removal.mjs --self-test
      # ★最賃の年度が進んだかの見張り。実際に厚労省を叩くのは週1(source-urls.yml)。
      #   ここでは【年度の読み取りと判定】だけ見る(ネットに触らない)。
      #   ★実物のページは全角の「令和７年度」★＝半角だけ見ると1件も拾えない。その罠を検査で固定している。
      - name: ★最賃の年度の見張りの判定 (--self-test・ネットに触らない)
        run: node kyuyo/scripts/check-saitei-nendo.mjs --self-test
      - name: Periods golden (期間分割K2が移設前と一致)
        run: node kyuyo/tests/periods-golden.test.mjs
      - name: Fixture reproducibility (入力fixtureが生成スクリプトと一致するか)
        run: node kyuyo/scripts/make-input-fixture.mjs --check && node kyuyo/scripts/make-periods-fixture.mjs --check
      - name: ★中央statutoryの写しが最新か (出典/確認日/指紋・最賃47県。手書きを2箇所に残さない)
        run: node kyuyo/scripts/pull-statutory.mjs --check
      - name: Statutory drift guard (lib == 中央statutory)
        run: node kyuyo/scripts/verify-statutory.mjs
